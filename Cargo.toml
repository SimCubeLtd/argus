[workspace]
resolver = "3"
members = ["crates/argus-core", "crates/argus-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "0BSD"
repository = "https://github.com/SimCubeLtd/argus"

# Shared dependency versions (aligned with SimCubeLtd/synapse where overlapping).
[workspace.dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.44", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.1", features = ["derive"] }
indicatif = "0.18.4"
ignore = "0.4.25"
toml = "1.1.2"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
tempfile = "3.14"
